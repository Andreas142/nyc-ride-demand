[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nycdemand"
version = "0.1.0"
description = "Forecasting NYC ride demand through a policy shock: data platform, models, causal study and MLOps on NYC TLC trip records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andreas Othonos" }]
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "pyyaml>=6",
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
# Installed when each module starts, so week 1 stays light.
eda = ["ipykernel>=6.29", "matplotlib>=3.9", "holidays>=0.60"]
ml = [
  "lightgbm>=4.3",
  "xgboost>=2.1",
  "catboost>=1.2",
  "optuna>=4.0",
  "scikit-learn>=1.5",
  "mlflow>=2.16",
  "evidently>=0.4",
]
causal = ["statsmodels>=0.14", "linearmodels>=6.0", "pyfixest>=0.30", "pysyncon>=1.5", "wildboottest>=0.3"]
# Deep learning challengers (module 2b). In Codespaces install CPU torch first: `make setup-dl`.
# Heavy training runs on a Kaggle GPU; see docs/compute.md.
dl = ["torch>=2.4", "neuralforecast>=3.0", "chronos-forecasting>=2.0", "onnx>=1.16", "onnxscript>=0.5"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "onnxruntime>=1.19", "streamlit>=1.39"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nycdemand = "nycdemand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
